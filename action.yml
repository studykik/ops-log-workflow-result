name: Log Workflow Result
description: Log the result (success / failure / cancelled) of a GitHub Actions job or workflow to an AWS CloudWatch log group.

inputs:
  log-group-name:
    description: CloudWatch log group to write to (must already exist - see infra/).
    required: false
    default: /github/workflow-results
  log-stream-name:
    description: Log stream to write to. Created if missing. Defaults to "<owner>/<repo>/<workflow>".
    required: false
    default: ""
  status:
    description: >
      Result to log, e.g. `job.status` (wrapped in an expression). Use this when the action is the last
      step of a job (with `if: always()`). Ignored if `needs` is provided.
    required: false
    default: ""
  needs:
    description: >
      `toJSON(needs)` (wrapped in an expression) from a final job that depends on all other jobs. The
      overall result is derived from the results of those jobs.
    required: false
    default: ""
  aws-region:
    description: AWS region of the log group. Defaults to AWS_REGION / AWS_DEFAULT_REGION from the environment.
    required: false
    default: ""
  dry-run:
    description: If "true", build and print the log event but do not send it to AWS.
    required: false
    default: "false"

outputs:
  result:
    description: The result that was logged (success, failure, cancelled, skipped).
    value: ${{ steps.build.outputs.result }}
  payload:
    description: The JSON log event that was (or would have been) sent.
    value: ${{ steps.build.outputs.payload }}

runs:
  using: composite
  steps:
    - name: Build log event
      id: build
      shell: bash
      env:
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_NEEDS: ${{ inputs.needs }}
        GH_WORKFLOW: ${{ github.workflow }}
        GH_JOB: ${{ github.job }}
        GH_ACTOR: ${{ github.actor }}
        GH_EVENT: ${{ github.event_name }}
        GH_REF: ${{ github.ref }}
        GH_SHA: ${{ github.sha }}
        GH_REPO: ${{ github.repository }}
        GH_RUN_ID: ${{ github.run_id }}
        GH_RUN_NUMBER: ${{ github.run_number }}
        GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        GH_SERVER_URL: ${{ github.server_url }}
      run: "${GITHUB_ACTION_PATH}/scripts/build-event.sh"

    - name: Send log event to CloudWatch
      if: inputs.dry-run != 'true'
      shell: bash
      env:
        LOG_GROUP: ${{ inputs.log-group-name }}
        LOG_STREAM: ${{ inputs.log-stream-name }}
        INPUT_REGION: ${{ inputs.aws-region }}
        GH_REPO: ${{ github.repository }}
        GH_WORKFLOW: ${{ github.workflow }}
        PAYLOAD: ${{ steps.build.outputs.payload }}
      run: "${GITHUB_ACTION_PATH}/scripts/put-event.sh"
