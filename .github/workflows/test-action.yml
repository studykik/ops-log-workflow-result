# Exercises the action in dry-run mode (no AWS needed) and asserts the logged result.
name: Test action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # post step reads the job's step results
  checks: read    # assert-post-mode reads annotations

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test

  # --- Usage 1: post step (no status/needs) ------------------------------------
  # The action emits a "log-workflow-result" notice annotation with the result,
  # which assert-post-mode checks once these jobs have finished.

  post-succeeding-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          dry-run: "true"
      - run: echo "doing work"

  post-failing-job:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          dry-run: "true"
      - run: exit 1

  assert-post-mode:
    needs: [post-succeeding-job, post-failing-job]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          logged_result() {
            job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq ".jobs[] | select(.name == \"$1\") | .id")
            gh api "repos/$GITHUB_REPOSITORY/check-runs/$job_id/annotations" \
              --jq '.[] | select(.title == "log-workflow-result") | .message'
          }
          test "$(logged_result post-succeeding-job)" = "success"
          test "$(logged_result post-failing-job)" = "failure"

  # --- Usage 2: last step of a job, using job.status ---------------------------
  succeeding-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "doing work"
      - id: log
        if: always()
        uses: ./
        with:
          status: ${{ job.status }}
          dry-run: "true"
      - if: always()
        run: test "${{ steps.log.outputs.result }}" = "success"

  failing-job:
    runs-on: ubuntu-latest
    # Keep the workflow green even though this job fails on purpose.
    continue-on-error: true
    outputs:
      result: ${{ steps.log.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - run: exit 1
      - id: log
        if: always()
        uses: ./
        with:
          status: ${{ job.status }}
          dry-run: "true"

  assert-failing-job:
    needs: failing-job
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.failing-job.outputs.result }}" = "failure"

  # --- Usage 3: final job summarising the whole workflow via needs -----------

  summary:
    needs: [succeeding-job, failing-job]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: log
        uses: ./
        with:
          needs: ${{ toJSON(needs) }}
          dry-run: "true"
      - env:
          PAYLOAD: ${{ steps.log.outputs.payload }}
        run: |
          jq -e '.jobs["succeeding-job"] == "success"' <<<"$PAYLOAD"
          jq -e '.jobs | has("failing-job")' <<<"$PAYLOAD"
